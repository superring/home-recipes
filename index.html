<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今晚吃什么</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F7F2EA; --surface:#FFFDFA; --ink:#2A2320; --muted:#8B7E72; --line:#E6DDD0;
  --accent:#C4432F; --accent-ink:#FFF7F4; --veg:#5F7A4C; --chip:#EFE7DB; --chip-on:#2A2320;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1815; --surface:#26211D; --ink:#F1E9DF; --muted:#A3968A; --line:#3A322B;
    --accent:#E0644F; --accent-ink:#1C1815; --veg:#9DB57E; --chip:#2F2925; --chip-on:#F1E9DF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1815; --surface:#26211D; --ink:#F1E9DF; --muted:#A3968A; --line:#3A322B;
  --accent:#E0644F; --accent-ink:#1C1815; --veg:#9DB57E; --chip:#2F2925; --chip-on:#F1E9DF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top>*{min-width:0}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
h1 small{font-family:"Noto Sans SC",sans-serif;font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:.08em}
.dice{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--accent);padding:6px 10px;border:1px solid var(--accent);border-radius:999px;white-space:nowrap}
.dice:active{transform:scale(.97)}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;color:inherit;min-width:0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg)}

main{padding:14px 16px 0}
.count{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{min-width:0;width:100%;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;position:relative;transition:transform .12s}
.card:active{transform:scale(.98)}
.card .ph{aspect-ratio:4/3;background:var(--chip);width:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h2{margin:0;font-size:16px;font-weight:700;line-height:1.35;text-wrap:balance}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted);margin-top:auto}
.card .meta span{background:var(--chip);border-radius:6px;padding:2px 6px}
.card .meta .home{color:var(--accent)}
.card .meta .time{background:none;padding-left:0}
.card .heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,253,250,.9);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card.picked .heart{background:var(--accent);color:var(--accent-ink)}
.card.picked{outline:2px solid var(--accent);outline-offset:-2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(60,40,20,.08);transform:translateY(110%);transition:transform .2s}
.bar.show{transform:none}
.bar .picks{flex:1;min-width:0}
.bar .picks b{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.bar .picks div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.send{flex:none;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:12px;display:inline-flex;align-items:center;gap:6px}
.clear{flex:none;color:var(--muted);font-size:13px;padding:8px}
@media (prefers-reduced-motion:reduce){.bar,.card{transition:none}}

.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet .hero{position:relative;aspect-ratio:4/3;max-height:52vh;background:var(--chip)}
.sheet .hero img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .back{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,253,250,.92);color:#2A2320;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sheet .inner{padding:18px 20px 40px;max-width:680px;margin:0 auto}
.sheet h2{margin:0 0 6px;font-size:24px;line-height:1.3;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px}
.sheet .sub a{color:var(--muted)}
.sheet p.intro{margin:0 0 16px;color:var(--ink)}
.sheet h3{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:22px 0 8px;text-transform:uppercase}
.ings{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:0;padding:0;list-style:none}
.ings li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ings li span:last-child{color:var(--muted);text-align:right;flex:none;max-width:50%}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 36px;counter-increment:s;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--chip);color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tips{background:var(--surface);border-left:3px solid var(--veg);padding:10px 14px;border-radius:0 10px 10px 0;white-space:pre-line;font-size:14px}
.sheet .pick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:26px;padding:14px;border-radius:14px;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:16px}
.sheet .pick.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 class="serif">今晚吃什么<small>拿手好菜</small></h1>
    <button class="dice" id="dice" type="button" aria-label="随机挑一道">🎲 随机一道</button>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜菜名或食材，比如“牛肉”" autocomplete="off">
  </label>
  <div class="chips" id="chips"></div>
</header>

<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

<div class="bar" id="bar">
  <div class="picks"><b>今天想吃</b><div id="pickNames"></div></div>
  <button class="clear" id="clear" type="button">清空</button>
  <button class="send" id="send" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4z"/></svg>
    发给他
  </button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

, "糖 少许", "地瓜粉或玉米淀粉 少许"], "steps": ["牛肉洗净切片，加入少许葱姜水（用姜丝跟葱段加少许水用力抓挤的汁水）抓匀至汁水完全被牛肉吸收，加入盐、鸡精、黑胡椒粉、生抽，调味抓匀腌制片刻。这里的用量我只能写大约，无法精准到几克，可根据自家肉的量自行增减。", "在抓匀后的肉片上倒入约1汤匙的食用油再次拌匀，这就是让牛肉炒起来不老的妙招之一。用油封住牛肉的水份，炒起来就不柴了，将牛肉抓匀加入少许的地瓜粉糊，不要多，薄薄的一层就好，抓匀后放一旁备用。", "把所需的菜洗净，土豆切粗条状，水烧开后放点盐，放入土豆条煮熟。 有厨友问直接炸了就行，干嘛还要煮一下，多此一举。其实我的薯条切得厚又粗，个人觉得煮一下，炸的时候更容易熟透。你若觉得麻烦可省略这一步，但在炸时用小火才能炸熟。或者把薯条切小条点，别像我那样粗。", "土豆条煮熟后用油炸至金黄色捞出备用。", "锅里留适量的底油，油要比炒菜的油多些，放入牛肉大火快炒至变色盛起备用，这样炒牛肉片不容易生水。牛肉可分2次下锅炒，少量炒熟得快，不易老。若一大堆肉倒入一锅炒的话，摊不开，就容易炒把肉炒老了。", "牛肉盛出后留底油，放入切好的洋葱和青红椒，倒入适量的蚝油、盐和少许糖翻炒片刻。", "把牛肉和炸好的土豆条放入锅中，加适量的孜然粉和孜然拌匀，试试咸淡，不够味再添加调味后即可盛出。", "诱人的孜然土豆炒牛肉好了。超下饭，味道像烧烤牛肉，也是很适合当下酒菜哦。"], "tips": "牛肉在腌制时已加调味，所以在炒青红椒时先放蚝油和少许糖调味菜才不会没味道。\n不喜欢牛肉可以换成猪肉或者羊肉。", "title": "孜然土豆炒牛肉", "serves": ""}, {"slug": "小松菜炒蛋", "tags": ["素菜", "快手"], "time": "10分钟", "source": "https://www.gomaabura.jp/recipe/detail/12085", "intro": "用「压榨纯麻油」提香的家常快手炒菜，鸡蛋先炒半熟盛出，小松菜炒香后再回锅拌合。约10分钟完成，2人份。", "cover": "images/小松菜炒蛋-成品.jpg", "ingredients": ["小松菜 半把", "鸡蛋 2个", "盐 少许", "黑胡椒 少许", "压榨纯麻油 1大勺（分两次用）", "鸡汤粉 1/3小勺", "酱油 1/2小勺"], "steps": ["小松菜洗净沥干，切成4~5厘米长段。鸡蛋打入碗中，加盐和黑胡椒打散。", "平底锅中放入一半麻油（1/2大勺），中火加热，倒入蛋液炒至半熟后盛出备用。", "锅中放入剩下的麻油（1/2大勺），放入小松菜翻炒，加鸡汤粉和酱油炒匀。", "把鸡蛋倒回锅中，和小松菜轻轻拌合均匀，装盘。"], "tips": "", "title": "小松菜炒蛋（麻油香）", "serves": "2人份"}, {"slug": "小炒西葫芦", "tags": ["素菜", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/106163145/", "intro": "不一样的做法，不一样的口感。 菜谱调料请酌情添加，按你自己喜好咸淡就行，不用死搬硬套，多少西葫芦量配多少调料，可别一丢丢西葫芦也按我的料汁，这个菜谱做出来主要就是爽脆，炒制时间不宜太久（入锅到出锅二十秒左右就行）， 麻烦小主们看清楚菜谱，爱你们哟。❤️", "cover": "images/小炒西葫芦-成品.jpg", "ingredients": ["西葫芦 1个就选大的（2个就选小一点的）", "生抽 0.5 勺", "盐 适量（腌制用）", "小米椒 1个", "蒜 2瓣", "白糖 0.5勺", "番茄酱 0.5勺", "香醋 几滴", "香油 几滴"], "steps": ["西葫芦切开去瓤", "切成长条", "取适量的盐，捏几下，让水分充分出来，别腌制太久，久了容易咸，看见出水变软就挤干。", "挤干盐水", "清水洗净！再挤干，这样吃起来更爽脆。", "调料汁：1勺生抽、蚝油0.5勺，糖0.5勺鸡粉0.5勺，蕃茄酱0.5勺、记着啊千万不要放盐了。（调料按照自己平时吃菜口味酌情添加，因为西葫芦也有大有小，不能定死多少调料）（个人喝汤小勺）", "蒜切末、小米椒切圈", "起锅烧油爆香料头", "下西葫芦丝快速翻炒", "倒入提前准备好的料汁", "翻炒后加入几滴醋，增香", "少许香油", "出锅", "这盘是清炒的，一样很脆，前面步骤一样，就是不调料汁了，要放：油（少）、盐（少）、糖（可不放）、鸡精，这个更家常一点，也适合减肥的小姐姐们。"], "tips": "西葫芦入锅开始计时，炒个十几二十秒断个生就可以出锅了，时间长了就不好吃了，这样出来很脆。", "title": "小炒西葫芦", "serves": ""}, {"slug": "干煸菜花（五花肉版）", "tags": ["荤菜", "快手"], "time": "20分钟", "source": "https://www.xiachufang.com/recipe/267390/", "intro": "湘菜馆的干煸菜花焦香爽脆，是超人气的下饭菜，当然，来扎啤酒就更给力了。自己在家炒菜花操作不当很容易变成焖菜花，口感软烂，注意以下几点就能炒出焦香爽脆又入味的餐馆味道。 第一，最好用松花菜，松花菜又称散花菜、青梗松花菜、有机花菜、白面散花菜、有机菜花。具体样子步骤图里有。实在没有就普通菜花吧。 第二，铁锅和干锅菜花最搭配，最好用厚底铁锅，能爆炒保温性能又好。 第三，先用五花肉煸炒出油更能带出菜花的香味，肉越肥越好，不喜欢可以不吃，但配菜味道特别棒。 第四，菜花一定要沥干水分。 第五，一定要大火爆炒，略带焦色香味更浓。 第六，加一勺酱油是点晴之笔。 第七，盐一定要出锅前再放，不需多，快速炒匀后分布在菜花的表面，入口咸香更有滋味。 松花菜不用焯水，如果用普通菜花，焯水时间要短，及时过凉再充分沥干，否则真就是五花肉焖菜花了。", "cover": "images/干煸菜花（五花肉版）-成品.jpg", "ingredients": ["松花菜 半只", "五花肉 50克", "生姜 5克", "大蒜 三瓣", "辣椒 2个", "盐 2克", "酱油 15克"], "steps": ["菜花冲洗干净后用小刀沿着柄削成小朵，用淡盐水浸泡10分钟，充分沥干水分。", "五花肉入锅小火慢慢煸炒出油，如果肉不够肥，锅中可以先放少许油再煸，出油后加生姜炒出香味。", "开大火，油热的时候倒入菜花，铺匀略煎30秒再翻炒几下。", "盖上锅盖，调中火焗30秒。", "这时候可以看到菜花头有点焦色了。", "加入辣椒和大蒜碎翻炒几下。这个是之前的老锅，现在已经淘汰了。", "炒匀后加入一勺生抽，翻炒均匀。", "起锅前加入一勺盐炒匀即可。", "焦香爽脆，超级下饭。"], "tips": "", "title": "干煸菜花（五花肉版）", "serves": ""}, {"slug": "干煸菜花（快手版）", "tags": ["荤菜", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/104268287/", "intro": "", "cover": "images/干煸菜花（快手版）-成品.jpg", "ingredients": ["花菜 1个", "肥肉 30g", "干辣椒花椒 适量", "生抽 2勺", "蚝油 1勺", "鸡精 1勺", "白糖 1勺", "葱蒜 适量"], "steps": ["菜花洗净，拆成大小均匀的小块。个人喜欢用剪子，方便。", "必须沥干水分，不要炒的时候出汤。", "下肥肉小火煸出油。", "小火先爆香花椒干辣椒，再放入葱蒜。", "加入菜花，大火炒制微焦，发黄。", "加生抽2勺、蚝油1勺、白糖1勺、鸡精1勺调味。", "倒入锅内，大火收干汁。", "出锅前加入一些芝麻，点一点香油。"], "tips": "1.肥肉不喜欢吃可以换植物油，或者肥肉少，加一些植物园也行，不怕油多。\n2.干辣椒喜欢吃辣可以多放。\n3怕淡，出锅前可以加盐。", "title": "干煸菜花（快手版）", "serves": ""}, {"slug": "牛肉炖萝卜", "tags": ["荤菜", "汤"], "time": "1小时", "source": "https://www.xiachufang.com/recipe/1071233/", "intro": "很适合冷冷的冬天 暖暖的 很满足。牛肉和白萝卜真是绝配 也太好吃了吧。调味料千万不要加很多 不然就会盖住牛肉和萝卜原本的味道了。 这道菜温暖了想家的心。", "cover": "images/牛肉炖萝卜-成品.jpg", "ingredients": ["牛肉", "胡椒粉", "白萝卜", "葱", "姜", "大料", "盐", "生抽", "料酒", "糖"], "steps": ["葱和姜都切成 葱末 姜末 和 葱段 姜片 两部分。把牛肉切成小块 冷水入锅 煮出血水。盛出牛肉 用温水冲净表面附着的血水。", "另起煮锅 倒入油 爆香葱姜末。倒入牛肉 翻炒。", "加入适量料酒和生抽 少量糖 继续翻炒。", "添入热水 没过牛肉。（可以多加些水 确保之后不会再添水影响味道。）放入大料 葱段 姜片 适量胡椒粉。大火煮开后转小火煮炖30分钟左右。", "加入白萝卜继续煮炖。炖的时间可以自己掌握 期间根据汤的口味加入适量的盐。等到白萝卜透明 牛肉的香味也溢出啦 就可以出锅享受美味了。"], "tips": "1. 千万不要加太多的生抽 不仅汤的颜色会深 而且会盖住食物本身的味道。咸淡可以通过加盐调节。 \n2. 煮炖的时间越久牛肉越烂越好吃哦。 \n3. 出锅后可以撒些葱末 又美观又好吃。", "title": "牛肉炖萝卜", "serves": ""}, {"slug": "红烧蘑菇豆腐", "tags": ["素菜", "快手"], "time": "20分钟", "source": "https://www.xiachufang.com/recipe/104589509/", "intro": "", "cover": "images/红烧蘑菇豆腐-成品.jpg", "ingredients": ["豆腐 1块", "蘑菇 8-10个", "蒜 2瓣", "生抽 3勺", "蚝油 2勺", "盐 少许"], "steps": ["蘑菇切片备用", "老豆腐切片备用", "热油锅，把豆腐煎至两面金黄盛出备用", "热油锅，下蒜炒香，下蘑菇翻炒至蘑菇完全变软", "加酱油、蚝油和盐调味，加豆腐翻炒，加一点水煮一会儿（大约五分钟），让豆腐入味后即可出锅", "盛出"], "tips": "", "title": "红烧蘑菇豆腐", "serves": ""}, {"slug": "羊肉炖白萝卜", "tags": ["荤菜", "汤"], "time": "1.5小时", "source": "https://www.xiachufang.com/recipe/102864824/", "intro": "冬天暖胃的炖羊肉，用高压锅隔水蒸过再和白萝卜一起炖，成品软烂入味又不柴。", "cover": "images/羊肉炖白萝卜-成品.jpg", "ingredients": ["羊肉 1500克", "白萝卜 1根", "大葱 1段", "大蒜白 1段", "洋葱 小半个", "小米椒 适量", "八角 2个", "桂皮 1小块", "花椒 10粒", "香叶 2片", "生姜 1块", "白芷 2片", "草果 1个", "冰糖 1块", "啤酒 1罐", "盐 适量", "生抽 2汤勺", "白胡椒粉 1小勺", "小芹菜 几根"], "steps": ["羊肉洗净，冷水下锅，水开后煮5-6分钟捞出洗净备用（可买带一点脂肪覆盖的部位，熟后肥而不腻）。", "煮羊肉的同时准备好八角、桂皮、花椒、香叶、生姜、白芷、草果等香料，葱蒜切好备用。", "沥干的羊肉直接下干净的锅（不放油）炒，把水分炒掉后，挑出没有脂肪的部分。", "剩下带脂肪的继续翻炒出油脂后盛出——去掉一些油脂，炒出的羊油炖出来更香。", "锅里加一些油，把步骤2准备好的香料和葱蒜爆香，放入羊肉翻炒一会儿。", "倒入半罐啤酒，盖锅盖焖1分钟左右，加白胡椒粉和生抽炒匀，装入大碗。", "隔水放入高压锅蒸（下面垫个三脚架）：电压力锅牛羊肉程序25分钟，普通高压锅上汽后转中小火15分钟。蒸好后可以分一半留着改天做红烧羊肉，另一半连汤汁用来炖萝卜。", "白萝卜去皮切块，洋葱、大蒜白、小米椒切好。", "锅里放油，爆香洋葱、蒜白、小米椒，放入白萝卜翻炒几下。", "放入蒸好的羊肉连汤汁一起倒入，翻炒均匀后倒入另外半罐啤酒，盖锅盖焖1分钟。", "加开水没过食材，烧开后盖锅盖小火焖，焖至萝卜快酥烂时放盐调味，再焖一会儿。", "萝卜焖烂后撒上切好的小芹菜即可。汤汁多的话也可以直接倒入火锅锅中边煮边吃。"], "tips": "调料可以根据自己的口味调整。没有高压锅的话直接放锅里炖也可以，只是用高压锅隔水蒸过再炖，成品更软烂入味、不容易柴，也比直接炖省时间。", "title": "羊肉炖白萝卜", "serves": ""}, {"slug": "芹菜家常豆腐", "tags": ["素菜", "快手"], "time": "20分钟", "source": "https://www.xiachufang.com/recipe/107192879/", "intro": "楼下超市卖的老豆腐，豆腐味儿浓，跟小时候石磨磨出来的豆腐味道一样。我们一家人都喜欢吃，经常买回来换着方法做。", "cover": "images/芹菜家常豆腐-成品.jpg", "ingredients": ["老豆腐 一块（400克左右）", "芹菜 一棵", "蒜 5瓣", "小米椒 适量", "食盐 适量", "生抽 适量", "蚝油 适量"], "steps": ["准备好材料，把老豆腐冲洗一下晾干表面的水。", "把芹菜洗干净，切好备用。 大蒜和小米椒都切碎。 用生抽、盐、蚝油加水调小半碗料汁，生抽和蚝油都有盐，加少许食盐即可。", "锅烧热倒适量的油，油烧热后，把切成块的豆腐放入锅里，小火煎。", "把豆腐煎得两面金黄。", "煎好的豆腐先放在盘子里。", "先把切好的大蒜和小米椒放入锅里，小火炒香。 再放入芹菜翻炒。", "倒入煎好的豆腐，把调好的料汁淋在豆腐上。", "翻炒几下，小火焖2分钟收汁。", "装盘，豆腐裹着汁液，有蒜香、咸香和小米椒的鲜香，好下饭。"], "tips": "", "title": "芹菜家常豆腐", "serves": ""}, {"slug": "芹菜炒牛肉", "tags": ["荤菜", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/107017526/", "intro": "今天分享一道芹菜炒牛肉，依旧是快手菜，真的又香又好吃😋牛肉嫩滑", "cover": "images/芹菜炒牛肉-成品.jpg", "ingredients": ["牛肉 500克", "芹菜 100克"], "steps": ["牛肉逆纹理切好，加蚝油、胡椒粉、少许蛋清和淀粉（薄薄一层即可）抓拌均匀，最后加少许花生油再次抓拌封油（锁住水分），腌制半小时。", "芹菜、小米辣、蒜切好备用。", "热锅热油，牛肉下锅快速滑散，炒至八九分熟盛出（时间越短牛肉越嫩）。", "锅留底油，倒入蒜末和小米辣爆香，接着倒入芹菜和牛肉，加盐、鸡精、辣椒面、一勺生抽调味，大火快炒7、8下即可出锅。"], "tips": "", "title": "芹菜炒牛肉", "serves": ""}, {"slug": "蒜蓉金针菇", "tags": ["素菜", "快手"], "time": "20分钟", "source": "https://www.xiachufang.com/recipe/105909485/", "intro": "👉蒜香浓郁，比肉还好吃，而且超下饭～蒜蓉金针菇！清爽不油腻，做法简单，十分钟就能做好！每次做这道菜，我儿子都可以吃两碗米饭🍚", "cover": "images/蒜蓉金针菇-成品.jpg", "ingredients": ["金针菇 1捆", "蒜 5瓣", "生抽 2勺", "蚝油 1勺", "糖 半勺", "盐 2克", "小米辣 2个", "葱 1根", "蒸鱼鼓油 1勺"], "steps": ["金针菇洗干净去根，掰小朵摆盘子里", "小米辣切圈。葱切花", "蒜打成蒜蓉", "起锅热油爆香蒜末和辣椒", "加入一小勺盐", "半勺白糖", "两勺生抽", "一勺蚝油", "翻炒均匀", "浇在金针菇上", "大火蒸8分钟", "出锅后淋上一勺蒸鱼鼓油，撒上葱花即可", "好吃又美味！"], "tips": "", "title": "蒜蓉金针菇", "serves": ""}, {"slug": "蘑菇青菜粥", "tags": ["主食", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/101865864/", "intro": "标题太长，念的时候自我停顿，喘不过气来别赖我😂😂😂 蘑菇青菜营养好，对付不爱吃菜的孩子们，煮成菜粥不失为一种好办法😄 猪油有补脑润肺润肤的功效，适当食用一些猪油对身体有好处。 PS：动手之前先看菜谱下面小贴示 还有更快更省时的电饭煲，电压力锅煮粥方法 【如用电饭煲或电压力锅煮粥，大米不用冷冻！！！】", "cover": "images/蘑菇青菜粥-成品.jpg", "ingredients": ["口蘑，香菇 共五朵", "油菜 两棵", "胡萝卜 半根", "西兰花 少许", "香葱 两根", "猪油 适量", "昆布粉 少许", "大米 150g", "开水 1650ml"], "steps": ["头天晚上先将大米洗净控干水装入保鲜袋放冰箱冷冻室冷冻(冻硬实为止)平时可以多准备几包，随用随取。", "口蘑香菇洗净切片，香葱切碎，胡萝卜用模具刻出花朵形状，不想费事就直接切片切丝都行，刻花剩下的边角料切成小粒。", "锅里放一小勺猪油(不喜猪油的可以用玉米油等植物油）", "放入蘑菇片煸炒至软，加适量盐调味，撒入葱花翻炒均匀出锅装入保鲜盒，晾凉后放入冰箱冷藏，剩下的事就明早再做吧。 (绿叶蔬菜不宜炒好冰箱冷藏过夜)", "第二天早上起来，先烧开一锅水(我一般是用电水壶烧水，等水开的时候可以洗菜) 水开再下冷冻好的大米，大火煮开改中火保持微微沸腾的状态熬煮至大米开花，不时用汤勺搅拌一下以免糊底。 【划重点】 大米无需解冻！ 米与水的比例为1:11，即1杯米11杯水，差不多150g米放1650ml的水，不要觉得水多，后面粥会越煮越稠的。", "熬粥的同时把油菜洗净切碎，西兰花掰小朵", "粥已煮至米粒开花绵软时把青菜碎和西兰花放进去，还可以扔把玉米粒进去(我这次忘记放了😅)用盐和少许昆布粉调味，稍煮一两分钟搅拌均匀即可(没有昆布粉可用鸡精代替，给孩子吃可以不放，蘑菇本身就很鲜了）", "虽然是蔬菜粥，但因为蘑菇用猪油炒过所以味道很鲜美", "更快捷的方法：按照上述方法准备好食材，晚上用电压力锅煮上白粥(米和水的比例适当调整，1:9 一杯米九杯水)或用电饭煲预约功能煮好粥底，早上起来打开锅盖，旋钮向右拧一点加热档红灯亮起，当白粥开始冒小泡时放入炒过的蘑菇胡萝卜，各种青菜略煮一两分钟，用盐、昆布粉、白胡椒调味，轻轻搅动以免糊底，关掉开关，利用锅体余温咕嘟一会儿即可。"], "tips": "1、蘑菇一定要提前用葱油加盐炒以后才会更香，用来煮粥超入味\n2、猪油有补脑润肺润肤的功效，适当食用一些猪油对身体有益(详情请问度娘)\n3、如果有高汤(骨头汤，鸡汤)适量加一些熬粥会更好喝\n4、昆布粉是从海带中提出的纯天然无添加的调味品，市集有售。\n没有昆布粉可用鸡精代替，其实不放也可以，有菌菇已经很鲜美了。\n5、大米一定要洗后再冷冻，冷冻时间四小时以上，如果时间充裕可以用常规方法熬粥。\n6、如果用电压力锅煮粥，大米不用冷冻，米和水的比例调整为1:9", "title": "蘑菇青菜粥", "serves": ""}, {"slug": "蚝油杏鲍菇", "tags": ["素菜", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/101891872/", "intro": "", "cover": "images/蚝油杏鲍菇-成品.jpg", "ingredients": ["杏鲍菇 300克", "蚝油 1勺半左右", "姜蒜 适量", "青红小米椒 各两个", "生抽 1小勺", "小香葱 2根"], "steps": ["切好食材，杏鲍菇切成丝。", "姜蒜在油锅里爆香，倒入杏鲍菇翻炒至杏鲍菇稍软。", "加入1勺多点，约1勺半左右的蚝油，翻炒均匀。", "加入一点点生抽翻炒均匀", "加入小米椒翻炒", "最后出锅前撒上小香葱装盘。"], "tips": "蚝油本身比较咸，所以不用再放盐了。\n不吃辣的亲可以不放辣椒或者加一点彩椒配色。", "title": "蚝油杏鲍菇", "serves": ""}, {"slug": "西红柿鸡蛋汤", "tags": ["汤", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/106087260/", "intro": "看了小高姐怀念小时候家里的味道做了番茄蛋汤的视频，我也尝试了一下，但总觉得和我小时候喝到的差点儿味道。今天改良了一下，简直就是小时候的味道，并且更加营养！细碎的西红柿，绵密的蛋花飘在上面，闪着油光，配上翠绿的葱花点缀，完美！ 爱喝汤的朋友们快和我学起来吧，新人友好快手番茄蛋汤，你值得拥有！", "cover": "images/西红柿鸡蛋汤-成品.jpg", "ingredients": ["西红柿 2个", "鸡蛋 2个", "香油 2勺", "生抽 2勺", "小葱 2根", "淀粉 1勺", "盐 1勺"], "steps": ["番茄切成小丁儿，鸡蛋打散，葱切成葱花儿，备用。", "锅内油热后加入葱花炝锅儿。", "下入西红柿丁儿翻炒。这步是让蛋花汤更有营养，因为西红柿中的茄红素是脂溶性的，西红柿过一遍油能够让营养物质更好的释放出来。", "抄到西红柿软烂出汤。", "加入开水。我放了1000ml的开水，做了好大一锅汤。淀粉加水搅拌均匀，在汤中加入水淀粉，可以让汤变稠。", "开锅后，保持大火，在锅中冒泡泡的位置下入鸡蛋液，并且搅拌，蛋花一下子就出来啦！", "看，细密绵稠的鸡蛋花。", "关火后加入葱花，依据个人口味，加入生抽2勺，香油2勺，盐1勺，调味儿", "营养又美味的家常西红柿蛋花汤就做好啦！", "西红柿软烂，蛋花细碎，散发着葱香味儿和香油味儿。喝一口汤，浓浓的西红柿味儿中夹着咸香，简直完美！"], "tips": "1.西红柿中的茄红素是脂溶性的，所以用到西红柿的菜最好过油，更好吸收营养。\n2.番茄蛋汤的蛋花十分重要，锅开后一定要把蛋液洒在水开冒 小碗装上述材料调成汁", "锅里倒油，均匀撒入少许盐，烧热后把老豆腐铺在锅中煎", "将两面煎至金黄（如图", "捞出豆腐，锅内留底油", "爆香蒜末", "倒入上海青翻炒15秒", "将豆腐放入锅中，倒入料汁，大火烧开后盖盖子转中火烧1分钟", "打开盖子翻炒均匀", "最后淋入芡即可（一勺淀粉，小半碗水"], "tips": "个人非常喜欢的一道素菜，又好做又下饭", "title": "青菜炒豆腐", "serves": ""}, {"slug": "鸡蛋豆腐青菜汤", "tags": ["汤", "快手"], "time": "15分钟", "source": "https://www.xiachufang.com/recipe/106422610/", "intro": "天热喜欢喝点清淡的蔬菜汤，既可以保持食物原本的味道，又可以滋润肠胃。今天就准备一道鸡蛋豆腐青菜汤尝尝鲜。", "cover": "images/鸡蛋豆腐青菜汤-成品.jpg", "ingredients": ["鸡蛋 2个", "青菜 3颗", "豆腐 1块", "枸杞 少许", "食盐 适量", "鸡汁 适量"], "steps": ["两个鸡蛋打入碗中，加入少许食盐搅散。", "一块水豆腐切成博片备用", "一小把青菜清洗干净备用。", "两粒大蒜切碎备用。", "锅中烧油，打入鸡蛋液，炒成鸡蛋碎盛出。", "另起油锅 加入蒜末炒出香气。", "加入适量清水，豆腐和鸡蛋碎一起炖煮5分钟。", "最后加入青菜炖煮一分钟，加少许食盐和鸡汁调味，撒入少许枸杞即可。"], "tips": "这道汤做法简单但营养丰盛，蛋白质含量高，清淡又美味，适合家庭和减脂者食用。", "title": "鸡蛋豆腐青菜汤", "serves": ""}]</script>
<script>
const R = JSON.parse(document.getElementById('data').textContent);
const byId = Object.fromEntries(R.map(r => [r.slug, r]));
const TAGS = ['全部','自家拿手','荤菜','素菜','汤','主食','快手'];
let tag = '全部', q = '';
let picks = [];
try { picks = JSON.parse(localStorage.getItem('picks') || '[]').filter(s => byId[s]); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderChips(){
  $('#chips').innerHTML = TAGS.map(t => `<button class="chip" type="button" aria-pressed="${t===tag}" data-t="${t}">${t}</button>`).join('');
}
function filtered(){
  const s = q.trim().toLowerCase();
  return R.filter(r => (tag==='全部' || r.tags.includes(tag)) &&
    (!s || r.title.toLowerCase().includes(s) || r.ingredients.some(i => i.toLowerCase().includes(s))));
}
function renderGrid(){
  const list = filtered();
  $('#count').textContent = `${list.length} 道菜`;
  $('#grid').innerHTML = list.length ? list.map(r => `
    <button class="card ${picks.includes(r.slug)?'picked':''}" type="button" data-s="${r.slug}">
      ${r.cover ? `<img class="ph" src="${esc(r.cover)}" alt="" loading="lazy">` : `<div class="ph"></div>`}
      <span class="heart" data-heart="${r.slug}" aria-label="想吃">${heart(picks.includes(r.slug))}</span>
      <div class="body">
        <h2 class="serif">${esc(r.title)}</h2>
        <div class="meta">
          ${r.tags.includes('自家拿手') ? '<span class="home">自家拿手</span>' : ''}
          ${r.tags.filter(t => t!=='自家拿手').map(t => `<span>${esc(t)}</span>`).join('')}
          ${r.time ? `<span class="time">${esc(r.time)}</span>` : ''}
        </div>
      </div>
    </button>`).join('') : `<div class="empty">没找到，换个词试试</div>`;
}
function heart(on){
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.2 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>`;
}
function renderBar(){
  const names = picks.map(s => byId[s].title);
  $('#pickNames').textContent = names.join('、');
  $('#bar').classList.toggle('show', picks.length > 0);
  try { localStorage.setItem('picks', JSON.stringify(picks)); } catch (e) {}
}
function toggle(slug){
  picks = picks.includes(slug) ? picks.filter(s => s!==slug) : [...picks, slug];
  renderGrid(); renderBar();
  const b = $('#sheet .pick'); if (b && b.dataset.s===slug) b.replaceWith(pickBtn(slug));
}
function pickBtn(slug){
  const on = picks.includes(slug);
  const b = document.createElement('button');
  b.className = 'pick' + (on?' on':''); b.type='button'; b.dataset.s = slug;
  b.innerHTML = heart(on) + (on ? '已加入今天的菜单' : '今天想吃这个');
  b.onclick = () => toggle(slug);
  return b;
}
function openSheet(slug){
  const r = byId[slug];
  const sh = $('#sheet');
  sh.innerHTML = `
    <div class="hero">${r.cover ? `<img src="${esc(r.cover)}" alt="${esc(r.title)}">` : ''}
      <button class="back" type="button" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="inner">
      <h2 class="serif">${esc(r.title)}</h2>
      <div class="sub">
        ${r.serves ? `<span>${esc(r.serves)}</span>` : ''}
        ${r.time ? `<span>约 ${esc(r.time)}</span>` : ''}
        ${r.source ? `<a href="${esc(r.source)}" target="_blank" rel="noopener">原菜谱 ↗</a>` : ''}
      </div>
      ${r.intro ? `<p class="intro">${esc(r.intro)}</p>` : ''}
      <h3>材料</h3>
      <ul class="ings">${r.ingredients.map(i => { const m = i.match(/^(.+?)\s+(\S+)$/); return m ? `<li><span>${esc(m[1])}</span><span>${esc(m[2])}</span></li>` : `<li><span>${esc(i)}</span></li>`; }).join('')}</ul>
      <h3>做法</h3>
      <ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      ${r.tips ? `<h3>小贴士</h3><div class="tips">${esc(r.tips)}</div>` : ''}
    </div>`;
  sh.querySelector('.inner').appendChild(pickBtn(slug));
  sh.querySelector('.back').onclick = closeSheet;
  sh.classList.add('open'); sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({sheet:slug}, '');
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  document.body.style.overflow = '';
  if (history.state && history.state.sheet) history.back();
}
window.addEventListener('popstate', () => { if ($('#sheet').classList.contains('open')) { $('#sheet').classList.remove('open'); document.body.style.overflow=''; } });

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; tag = b.dataset.t; renderChips(); renderGrid(); });
$('#q').addEventListener('input', e => { q = e.target.value; renderGrid(); });
$('#grid').addEventListener('click', e => {
  const h = e.target.closest('[data-heart]'); if (h) { e.stopPropagation(); toggle(h.dataset.heart); return; }
  const c = e.target.closest('.card'); if (c) openSheet(c.dataset.s);
});
$('#clear').onclick = () => { picks = []; renderGrid(); renderBar(); };
$('#dice').onclick = () => { const l = filtered(); if (!l.length) return; openSheet(l[Math.floor(Math.random()*l.length)].slug); };
$('#send').onclick = async () => {
  const text = '今晚想吃：' + picks.map(s => byId[s].title).join('、');
  if (navigator.share) { try { await navigator.share({text}); return; } catch (e) { if (e.name==='AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('已复制，去 LINE 粘贴给他'); }
  catch (e) { prompt('复制这段话发给他：', text); }
};

renderChips(); renderGrid(); renderBar();
</script>
</body>
</html>
